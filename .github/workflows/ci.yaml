name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint
        run: ruff check .
      - name: Unit and pipeline tests (synthetic data, no AWS needed)
        run: pytest -q

  pipeline:
    # Re-runs the pipeline up to freeze_buffer on the real, DVC-versioned data.
    # It never runs `prove`: the proof period may be scored once, by hand.
    needs: lint-and-test
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ap-southeast-2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Pull the raw data from S3
        run: dvc pull data/raw/hotels.csv.dvc
      - name: Reproduce validate -> split -> backtest -> freeze_buffer
        run: dvc repro freeze_buffer
      - name: Pipeline must be reproducible (committed dvc.lock matches)
        run: |
          git diff --exit-code dvc.lock || (echo "dvc.lock is out of date: run 'dvc repro freeze_buffer' and commit it" && exit 1)
      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: reports/
