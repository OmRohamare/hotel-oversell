
# Tune using training and choose periods only.
# Keep proof untouched for final reporting.
seed: 42

data:
  source: dvc
  raw_path: data/raw/hotels.csv
  expected_rows: 119390
  expected_cols: 32

cleaning:
  adr_cap: 2000

variants:
  primary: dedup
  list:
    - dedup
    - raw

rf_calibration:
  method: platt
  calib_months: 3

forward_chaining:
  min_train_months: 9
  fold_months: 3
  buffer_min: -6
  buffer_max: 10
  target_walks_per_1000: 6.5
  per_hotel: true

features:
  min_frequency: 20
  pool_top:
    country: 20
    agent: 30
    company: 10

models:
  segment_table:
    shrink_m: 10
  logistic:
    C: 0.5
    max_iter: 2000
  random_forest:
    n_estimators: 500
    min_samples_leaf: 100
    max_features: 0.3
    max_depth: 8
    max_samples: 0.5
    n_jobs: -1

buffer_grid:
  constant_min: -10
  constant_max: 25
  spread_max: 6.0
  spread_step: 0.25

bootstrap:
  n_boot: 2000

mlflow:
  enabled: true
  experiment: hotel-oversell
